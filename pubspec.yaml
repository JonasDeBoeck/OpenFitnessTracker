name: open_fitness_tracker
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  drift: ^2.35.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.2.1
  freezed_annotation: ^3.1.0
  go_router: ^18.0.1
  google_fonts: ^8.2.1
  google_mlkit_text_recognition: ^0.17.1
  image_picker: ^1.2.3
  json_annotation: ^4.12.0
  mobile_scanner: ^7.4.2
  path: ^1.9.1
  path_provider: ^2.1.6
  percent_indicator: ^4.2.5
  riverpod_annotation: ^4.0.7
  sqlite3: ^3.6.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  riverpod_generator: ^4.0.9
  drift_dev: ^2.35.0
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/icon/mark.svg

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#DCEEDD"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter_native_splash:
  color: "#3C6E4F"
  image: assets/icon/splash_mark.png
  android_12:
    image: assets/icon/splash_mark.png
    icon_background_color: "#3C6E4F"
